<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mingalar AI Chat</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#343541;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#202123;
  border-bottom:1px solid #444;
}

.logo{
  font-size:18px;
  font-weight:bold;
}

.newchat{
  background:#444654;
  color:white;
  border:1px solid #666;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 15px 90px;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  padding:14px 16px;
  border-radius:10px;
  line-height:1.6;
  white-space:pre-wrap;
}

.user{
  background:#444654;
}

.ai{
  background:#343541;
}

.input-area{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#343541;
  padding:12px;
  border-top:1px solid #444;
}

.input-box{
  max-width:850px;
  margin:auto;
  display:flex;
  gap:8px;
}

#messageInput{
  flex:1;
  padding:14px;
  border-radius:10px;
  border:1px solid #666;
  background:#40414f;
  color:white;
  font-size:16px;
  outline:none;
}

.send{
  padding:0 18px;
  border:0;
  border-radius:10px;
  background:#19c37d;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  text-align:center;
  margin-top:25vh;
  opacity:.8;
}
</style>
</head>

<body>

<header>
  <div class="logo">🤖 Mingalar AI</div>
  <button class="newchat" onclick="newChat()">＋ New Chat</button>
</header>

<div id="chat">
  <div class="empty" id="empty">
    <h2>Mingalar AI</h2>
    <p>How can I help you?</p>
  </div>
</div>

<div class="input-area">
  <div class="input-box">
    <input
      id="messageInput"
      type="text"
      placeholder="Message Mingalar AI..."
      onkeydown="handleKey(event)"
    >
    <button class="send" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>

let messages =
  JSON.parse(localStorage.getItem("mingalar_history")) || [];

function saveHistory(){
  localStorage.setItem(
    "mingalar_history",
    JSON.stringify(messages)
  );
}

function displayMessages(){

  const chat = document.getElementById("chat");
  const empty = document.getElementById("empty");

  chat.innerHTML = "";

  if(messages.length === 0){

    chat.innerHTML = `
      <div class="empty" id="empty">
        <h2>Mingalar AI</h2>
        <p>How can I help you?</p>
      </div>
    `;

    return;
  }

  messages.forEach(function(item){

    const div = document.createElement("div");

    div.className =
      "message " +
      (item.role === "user" ? "user" : "ai");

    div.textContent = item.text;

    chat.appendChild(div);

  });

  chat.scrollTop = chat.scrollHeight;
}

function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text = input.value.trim();

  if(!text) return;

  messages.push({
    role:"user",
    text:text
  });

  messages.push({
    role:"ai",
    text:"Mingalar AI is ready 🤖\n\nAPI ချိတ်ပြီးရင် ဒီနေရာမှာ AI အဖြေတကယ်ပြန်လာပါမယ်။"
  });

  saveHistory();

  input.value="";

  displayMessages();
}

function handleKey(event){

  if(event.key === "Enter"){
    sendMessage();
  }

}

function newChat(){

  messages = [];

  localStorage.removeItem("mingalar_history");

  displayMessages();
}

displayMessages();

</script>

</body>
</html>
